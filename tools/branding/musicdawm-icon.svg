<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- MusicDAWM icon: five level bars that spell an "M", over a dark blue tile. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2b3f73"/>
      <stop offset="1" stop-color="#141c33"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#3fd0c9"/>
      <stop offset="1" stop-color="#f6c453"/>
    </linearGradient>
  </defs>
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <g fill="url(#bar)">
    <rect x="86"  y="110" width="56" height="292" rx="28"/>
    <rect x="166" y="170" width="56" height="232" rx="28"/>
    <rect x="228" y="250" width="56" height="152" rx="28"/>
    <rect x="290" y="170" width="56" height="232" rx="28"/>
    <rect x="370" y="110" width="56" height="292" rx="28"/>
  </g>
</svg>
