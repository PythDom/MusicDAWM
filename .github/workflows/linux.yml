name: Linux build

# Builds MusicDAWM on Linux and runs the unit tests and the Mother smoke test.
# Not a shipped platform (DECISIONS.md D-009): the fastest place to run the tests.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/windows.yml"
      - "ci/windows-*.sh"

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # R5-light: the numpy decoding of the DiffVox presets (tools/diffvox)
  # against DiffVox's own PyTorch model, CI only (D-047)
  diffvox-presets:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: DiffVox (pinned) and its Python dependencies
        run: |
          git clone -q https://github.com/SonyResearch/diffvox.git "$RUNNER_TEMP/diffvox"
          git -C "$RUNNER_TEMP/diffvox" checkout -q 97ae464c758346a2b1474f533639135b114c0ce4
          pip install -q torch torchaudio --index-url https://download.pytorch.org/whl/cpu
          pip install -q numpy pyyaml hydra-core torchcomp torch-fftconv numba
      - name: Decoding check
        run: python3 tools/diffvox/check_decode.py "$RUNNER_TEMP/diffvox"
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # git describe needs the history; ci/ardour-tag.sh adds the tag
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build
        id: build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: bash ci/linux-build.sh
      - name: Unit tests
        run: bash ci/linux-tests.sh 2>&1 | tee linux-tests.log; exit ${PIPESTATUS[0]}
      - name: Mother smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 tools/mother-smoke/make_wavs.py "$RUNNER_TEMP/wavs"
          export TOP="$PWD"; . build/gtk2_ardour/ardev_common_waf.sh
          build/session_utils/musicdawm9-mother_smoke "$RUNNER_TEMP/mother" "$RUNNER_TEMP"/wavs/*.wav
          build/session_utils/musicdawm9-export -o "$RUNNER_TEMP/mother-mix.wav" "$RUNNER_TEMP/mother" Mother
          python3 -c "import wave,sys; w=wave.open(sys.argv[1]); n=w.getnframes()/w.getframerate(); print('export', n, 's'); sys.exit(abs(n-343) > 0.01)" "$RUNNER_TEMP/mother-mix.wav"
      - name: Drum Studio tests
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          sudo apt-get install -y -qq python3-mido
          python3 tools/drumstudio/test_grooves.py
          export TOP="$PWD"; . build/gtk2_ardour/ardev_common_waf.sh
          build/session_utils/musicdawm9-drum_studio_test "$RUNNER_TEMP/drums" "$PWD/share/drumstudio/grooves"
      - name: DAWproject import test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 tools/dawproject/make_test_project.py "$RUNNER_TEMP/test.dawproject"
          export TOP="$PWD"; . build/gtk2_ardour/ardev_common_waf.sh
          build/session_utils/musicdawm9-dawproject_test "$RUNNER_TEMP/dawproject" "$RUNNER_TEMP/test.dawproject"
      - name: Tap Tempo Map test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          export TOP="$PWD"; . build/gtk2_ardour/ardev_common_waf.sh
          build/session_utils/musicdawm9-tap_tempo_test "$RUNNER_TEMP/taps"
      - name: Final Mix test (bundled x42 plug-ins)
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          bash ci/x42-mix-plugins-build.sh "$RUNNER_TEMP/lv2" > x42.log 2>&1 || { tail -n 40 x42.log; exit 1; }
          export TOP="$PWD"; . build/gtk2_ardour/ardev_common_waf.sh
          LV2_PATH="$RUNNER_TEMP/lv2" build/session_utils/musicdawm9-final_mix_test "$RUNNER_TEMP/finalmix"
      - name: Waveform import test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          W="$RUNNER_TEMP/waveform"; python3 tools/waveform/make_test_project.py "$W"
          export TOP="$PWD"; . build/gtk2_ardour/ardev_common_waf.sh
          T=build/session_utils/musicdawm9-waveform_test
          $T "$RUNNER_TEMP/wf-xml" "$W/Mother Edit 1.tracktionedit"
          $T "$RUNNER_TEMP/wf-bin" "$W/Mother Edit 2.tracktionedit"
          $T --convert "$W/Mother Edit 1.tracktionedit" "$RUNNER_TEMP/Mother.dawproject"
          $T "$RUNNER_TEMP/wf-dp" "$RUNNER_TEMP/Mother.dawproject"
      - name: ARA test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          P=$(bash ci/ara-testplugin-build.sh "$RUNNER_TEMP/ara-sdk" | tail -1)
          # Ardour trusts a plug-in's scan cache only if the plug-in file is older
          # (whole seconds); a plug-in built just now fails the scan
          find "$P" -exec touch -d '1 hour ago' {} +
          export TOP="$PWD"; . build/gtk2_ardour/ardev_common_waf.sh
          build/session_utils/musicdawm9-ara_test "$RUNNER_TEMP/ara" "$P"
          build/session_utils/musicdawm9-ara_test --reload "$RUNNER_TEMP/ara" "$P"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs
          path: linux-tests.log
          if-no-files-found: ignore

