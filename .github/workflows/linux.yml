name: Linux build

# Builds MusicDAWM on Linux and runs the unit tests and the Mother smoke test.
# Not a shipped platform (DECISIONS.md D-009): the fastest place to run the tests.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/windows.yml"
      - "ci/windows-*.sh"

concurrency:
  group: linux-${{ github.ref }}
  cancel-in-progress: true

jobs:
  linux:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # git describe needs the history; ci/ardour-tag.sh adds the tag
      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: .ccache
          key: ccache-linux-${{ github.sha }}
          restore-keys: ccache-linux-
      - name: Build
        id: build
        env:
          CCACHE_DIR: ${{ github.workspace }}/.ccache
          CCACHE_MAXSIZE: 2G
        run: bash ci/linux-build.sh
      - name: Unit tests
        run: bash ci/linux-tests.sh 2>&1 | tee linux-tests.log; exit ${PIPESTATUS[0]}
      - name: Mother smoke test
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        run: |
          python3 tools/mother-smoke/make_wavs.py "$RUNNER_TEMP/wavs"
          export TOP="$PWD"; . build/gtk2_ardour/ardev_common_waf.sh
          build/session_utils/musicdawm9-mother_smoke "$RUNNER_TEMP/mother" "$RUNNER_TEMP"/wavs/*.wav
          build/session_utils/musicdawm9-export -o "$RUNNER_TEMP/mother-mix.wav" "$RUNNER_TEMP/mother" Mother
          python3 -c "import wave,sys; w=wave.open(sys.argv[1]); n=w.getnframes()/w.getframerate(); print('export', n, 's'); sys.exit(abs(n-343) > 0.01)" "$RUNNER_TEMP/mother-mix.wav"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: linux-logs
          path: linux-tests.log
          if-no-files-found: ignore

