name: Windows build

# Native MSYS2 (UCRT64) build of MusicDAWM on a Windows runner, packaged as a
# portable folder, then checked with the Mother smoke test. See DECISIONS.md D-007.
on:
  workflow_dispatch:
  push:
    paths-ignore:
      - "**.md"
      - ".github/workflows/linux.yml"
      - "ci/linux-*.sh"

concurrency:
  group: windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows-msys2:
    runs-on: windows-2022
    timeout-minutes: 180
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - name: Keep LF line endings
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0     # git describe needs the history; ci/ardour-tag.sh adds the tag
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: git base-devel
      - name: Build
        id: build
        run: bash ci/windows-msys2-build.sh stage 2>&1 | tee windows-build.log; exit ${PIPESTATUS[0]}
      - name: Make portable folder
        run: bash ci/windows-package.sh stage
      - name: Mother smoke test (bundle only, MSYS2 off PATH)
        run: |
          T=$(cygpath -u "$RUNNER_TEMP")
          python3 tools/mother-smoke/make_wavs.py "$T/wavs"
          wavs=(); for f in "$T"/wavs/*.wav; do wavs+=("$(cygpath -m "$f")"); done
          export PATH="$PWD/stage/bin:/usr/bin:/c/Windows/System32:/c/Windows"  # /usr/bin: MSYS tools only, no UCRT64 DLLs
          stage/bin/ardour9-mother_smoke.exe "$(cygpath -m "$T/mother")" "${wavs[@]}"
          stage/bin/ardour9-export.exe -o "$(cygpath -m "$T/mother-mix.wav")" "$(cygpath -m "$T/mother")" Mother
          ls -l "$T/mother-mix.wav"
      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        with:
          name: musicdawm-windows-x64-portable
          path: stage
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-logs
          path: |
            windows-build.log
            msys2-missing.txt
            build/config.log
            build.log
          if-no-files-found: ignore
